name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Verify & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Catalog drift check (swagger → generated catalog)
        run: npm run gen:check

      - name: Typecheck (host + browser halves)
        run: npm run typecheck

      - name: Unit tests (99 cases, mock servers + real Web server, no network)
        run: npm test

      - name: Build bundle (tsdown → lib/)
        run: npm run build

      - name: Browser bundle structure (loader id, slot, render)
        run: node scripts/verify-client.mjs

      - name: Built artifacts import in plain Node
        run: |
          node -e "import('./lib/index.js').then(m => { if (typeof m.apply !== 'function' || m.inject.join(',') !== 'tools,systemPrompt') process.exit(1); console.log('host ok —', m.inject.join(',')) })"
          node -e "const fs = require('node:fs'); const s = fs.readFileSync('lib/client.js', 'utf8'); if (!s.includes('window.__ModuleLoader__.load')) process.exit(1); console.log('client ok —', s.length, 'bytes')"
