# dsh-esi — `dsh web` overlay for development and acceptance runs.
#
# Usage (from this repository, after `npm run build`):
#   DSH_HOME=$PWD/.tmp/acceptance-home \
#     dsh web --patch "$PWD/scripts/web-patch.yml" --no-open --port 3081
#
# The overlay mounts the BUILT host half by absolute path, so the loader picks
# it up without installing the package into the profile. The plugin resolves
# its own dependencies from this repository's node_modules and its SDE data
# from `<repo>/data`.
#
# The browser half is not mounted this way (a path row has no package manifest
# for the client-module scan); install the package into a profile to verify the
# `EVE ESI` settings tab. Host tools and the JSON bridge are fully exercised.
#
# To use a different port, pass --port on the CLI: the Web profile's `webserver`
# row reads host/port from `webStartup`, so an overlay must not restate it.

- insert:
    - id: dsh-esi
      name: /home/alex/project/dsh-esi/lib/index.js
